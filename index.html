<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131110">
<meta name="color-scheme" content="dark">
<meta name="description" content="Registro de entrenamiento empuje / tiron / pierna. Series, pesos, bandas e historial, guardado en el propio movil.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bitacora">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<title>Bitácora de Fuerza</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#131110;
    --bg-2:#1A1715;
    --surface:#201C19;
    --surface-2:#2A2421;
    --line:#342E29;
    --line-soft:#26211E;
    --text:#F2EDE6;
    --text-2:#B4AA9E;
    --text-3:#8A8076;
    --accent:#F2A03D;
    --accent-ink:#2A1A06;
    --accent-dim:#7A5420;
    --good:#82BB7C;
    --danger:#D8564B;
    --b-negra:#57504B;
    --b-roja:#D2483F;
    --b-verde:#4E9D5A;
    --b-amarilla:#DDC04A;
    --b-azul:#4C80D2;
    --b-morada:#8C6DB0;
    /* identidad de rutina en calendario y gráficas (contraste y daltonismo verificados) */
    --r-empuje:#C9822F;
    --r-tiron:#5A8AD8;
    --r-pierna:#4E9D5A;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --cond:"Barlow Condensed","Arial Narrow",var(--sans);
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --r:10px;
    --tap:48px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none;padding:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  ::selection{background:var(--accent);color:var(--accent-ink)}

  .app{max-width:560px;margin:0 auto;padding:0 14px calc(112px + env(safe-area-inset-bottom));}

  /* ---------- cabecera ---------- */
  .top{
    position:sticky;top:0;z-index:30;
    background:linear-gradient(var(--bg) 72%,rgba(19,17,16,0));
    padding-top:calc(14px + env(safe-area-inset-top));
    margin:0 -14px;padding-left:14px;padding-right:14px;
  }
  .brandrow{display:flex;align-items:center;gap:11px;padding-bottom:12px}
  .mark{
    width:38px;height:38px;flex:none;border-radius:9px;
    background:var(--accent);color:var(--accent-ink);
    font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.02em;
    display:grid;place-items:center;
  }
  .brandrow h1{
    margin:0;font-family:var(--cond);font-weight:700;
    font-size:23px;letter-spacing:.01em;line-height:1.05;
  }
  .brandrow .sub{
    margin:1px 0 0;color:var(--text-3);font-size:12px;
    font-family:var(--mono);letter-spacing:-.01em;
  }
  .views{display:flex;gap:20px;border-bottom:1px solid var(--line-soft)}
  .views button{
    font-family:var(--cond);font-weight:600;font-size:15px;
    letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);
    padding:0 0 9px;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .views button[aria-current="true"]{color:var(--text);border-bottom-color:var(--accent)}

  .days{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:14px 0 4px}
  .days button{
    min-height:var(--tap);border-radius:var(--r);
    background:var(--bg-2);border:1px solid var(--line-soft);
    font-family:var(--cond);font-weight:600;font-size:17px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--text-2);
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;
    transition:background .12s,border-color .12s,color .12s;
  }
  .days button .n{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--text-3);text-transform:none}
  .days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .days button[aria-pressed="true"] .n{color:rgba(42,26,6,.72)}

  /* ---------- tira de datos de la sesión ---------- */
  .strip{
    display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;
    padding:14px 2px 16px;border-bottom:1px solid var(--line-soft);margin-bottom:4px;
  }
  .strip .k{display:flex;flex-direction:column;gap:1px}
  .strip .k b{
    font-family:var(--mono);font-weight:500;font-size:19px;
    letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  }
  .strip .k b small{font-size:11px;color:var(--text-3);margin-left:2px;letter-spacing:0}
  .strip .k span{
    font-family:var(--cond);font-size:12px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--text-3);font-weight:600;
  }
  .strip .k.zero b{color:var(--text-3)}
  .strip .spacer{flex:1}
  .linkbtn{
    font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--text-3);
    border:1px solid var(--line);border-radius:99px;padding:7px 13px;
  }
  .linkbtn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent-dim)}
  .linkbtn.dang{color:var(--danger);border-color:rgba(216,86,75,.35)}

  .repeat{
    width:100%;min-height:var(--tap);border-radius:var(--r);margin-top:12px;
    border:1px solid var(--accent-dim);background:rgba(242,160,61,.09);color:var(--accent);
    font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.06em;
    text-transform:uppercase;padding:0 14px;
  }

  /* ---------- ilustraciones ---------- */
  .art{display:block}
  .art .fig{fill:none;stroke:var(--text-2);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .art .eq{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .art .eqf{fill:var(--accent);stroke:none}
  .art .base{fill:none;stroke:var(--line);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .thumb{
    width:44px;height:44px;border-radius:10px;flex:none;overflow:hidden;
    background:var(--surface-2);border:1px solid var(--line-soft);
    display:grid;place-items:center;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ex.done .thumb{border-color:var(--accent-dim)}
  .media{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
  .shot{
    width:88px;height:88px;border-radius:12px;flex:none;overflow:hidden;position:relative;
    background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;padding:0;
  }
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot .cam{
    position:absolute;left:0;right:0;bottom:0;padding:3px 0;
    background:rgba(19,17,16,.85);color:var(--text-3);
    font-family:var(--cond);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  }
  .cue{font-size:13px;color:var(--text-2);line-height:1.45}
  .cue .lbl{
    display:block;font-family:var(--cond);font-size:11px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--text-3);margin-bottom:3px;
  }
  .cue .rm{
    display:inline-block;margin-top:7px;color:var(--text-3);text-align:left;
    font-family:var(--cond);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
    border-bottom:1px solid var(--line);
  }

  /* ---------- ejercicio ---------- */
  .list{display:flex;flex-direction:column;gap:8px;padding-top:12px}
  .ex{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
  .ex.open{border-color:var(--line);background:var(--bg-2)}
  .exhd{
    width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;
    text-align:left;padding:11px 14px;min-height:var(--tap);
  }
  .exname{font-weight:600;font-size:15.5px;letter-spacing:-.005em;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
  .equip{
    font-family:var(--cond);font-weight:600;font-size:11.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--text-3);
  }
  .extxt{display:block;min-width:0}
  .exlast{
    display:block;font-family:var(--mono);font-size:11.5px;color:var(--text-3);
    margin-top:3px;font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .exlast em{font-style:normal;color:var(--text-2)}
  .exmeta{display:flex;align-items:center;gap:9px;color:var(--text-3)}
  .pill{
    font-family:var(--mono);font-size:11px;font-weight:500;
    background:var(--surface-2);border-radius:99px;padding:3px 8px;color:var(--text-2);
  }
  .ex.done .pill{background:var(--accent);color:var(--accent-ink)}
  .chev{width:11px;height:11px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .16s}
  .ex.open .chev{transform:rotate(225deg) translate(-1px,-1px)}

  .exbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
  .sets{display:flex;flex-wrap:wrap;gap:6px}
  .setchip{
    display:inline-flex;align-items:center;
    background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
    font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;
  }
  .setchip.editing{border-color:var(--accent);background:rgba(242,160,61,.13)}
  .setchip .val{display:inline-flex;align-items:center;gap:8px;padding:7px 4px 7px 10px;color:inherit}
  .setchip i{width:7px;height:7px;border-radius:2px;flex:none;display:inline-block}
  .setchip .x{
    width:30px;height:32px;border-radius:6px;display:grid;place-items:center;
    color:var(--text-3);font-size:15px;line-height:1;
  }
  .setchip .x:hover{color:var(--danger);background:rgba(216,86,75,.12)}

  .pad{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:11px}
  .ex.open .pad{background:var(--surface)}
  .modes{display:flex;gap:5px;margin-bottom:10px}
  .modes button{
    flex:1;min-height:34px;border-radius:7px;border:1px solid var(--line-soft);
    background:var(--bg);font-family:var(--cond);font-weight:600;font-size:13px;
    letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);
  }
  .modes button[aria-pressed="true"]{color:var(--text);border-color:var(--line);background:var(--surface-2)}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field>label{
    font-family:var(--cond);font-weight:600;font-size:11.5px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--text-3);
  }
  .spin{display:grid;grid-template-columns:var(--tap) 1fr var(--tap);align-items:stretch;
    border:1px solid var(--line);border-radius:9px;background:var(--bg);overflow:hidden}
  .spin button{
    font-family:var(--mono);font-size:19px;color:var(--text-2);
    display:grid;place-items:center;min-height:var(--tap);
  }
  .spin button:active{background:var(--surface-2);color:var(--accent)}
  .spin input{
    border:none;background:none;text-align:center;width:100%;
    font-family:var(--mono);font-size:19px;font-weight:500;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;padding:0;min-width:0;
  }
  .spin input::-webkit-outer-spin-button,.spin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .bands{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .bands button{
    min-height:var(--tap);border-radius:9px;border:1px solid var(--line);
    background:var(--bg);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:5px;
    font-family:var(--cond);font-size:11px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--text-3);font-weight:600;
  }
  .bands button i{width:20px;height:6px;border-radius:3px;display:block}
  .bands button[aria-pressed="true"]{border-color:var(--accent);color:var(--text);background:var(--surface-2)}
  .padbtns{display:flex;gap:8px;margin-top:10px}
  .add{
    flex:1;min-height:var(--tap);border-radius:9px;
    background:var(--accent);color:var(--accent-ink);
    font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.08em;
    text-transform:uppercase;
  }
  .add:active{background:#D98C2E}
  .cancel{
    min-height:var(--tap);padding:0 16px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);color:var(--text-2);font-family:var(--cond);font-weight:600;
    font-size:14px;letter-spacing:.07em;text-transform:uppercase;
  }
  .hint{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:8px;text-align:center}
  .hint b{color:var(--accent);font-weight:500}

  /* modo edición */
  .exedit{display:flex;gap:5px;padding:0 14px 13px}
  .exedit button{
    min-height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);font-family:var(--cond);font-weight:600;font-size:12.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);
  }
  .exedit button.del{color:var(--danger);border-color:rgba(216,86,75,.35)}
  .exedit .grow{flex:1}
  .renamer{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:11px 12px;font-weight:600;
  }
  .newex{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:var(--r)}
  .newex .row{display:grid;grid-template-columns:1fr auto;gap:8px}
  .newex input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:var(--tap)}
  .newex button{
    min-height:var(--tap);padding:0 18px;border-radius:8px;background:var(--surface-2);
    border:1px solid var(--line);font-family:var(--cond);font-weight:700;font-size:15px;
    letter-spacing:.07em;text-transform:uppercase;
  }
  .addex{
    width:100%;min-height:var(--tap);border:1px dashed var(--line);border-radius:var(--r);
    color:var(--text-3);font-family:var(--cond);font-weight:600;font-size:14px;
    letter-spacing:.09em;text-transform:uppercase;
  }
  .addex:hover{color:var(--text-2);border-color:var(--text-3)}

  /* ---------- barra inferior ---------- */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(26,23,21,.94);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  }
  .dock .inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .dock .sum{font-family:var(--mono);font-size:12px;color:var(--text-3);flex:1;font-variant-numeric:tabular-nums}
  .dock .sum b{color:var(--text);font-weight:500}
  .rest{
    display:flex;align-items:center;gap:2px;
    border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--bg);
  }
  .rest button{min-width:38px;min-height:38px;border-radius:99px;display:grid;place-items:center;
    font-family:var(--mono);font-size:12px;color:var(--text-2)}
  .rest .clock{
    min-width:74px;text-align:center;font-family:var(--mono);font-size:16px;font-weight:500;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--text-3);
  }
  .rest.run .clock{color:var(--accent)}
  .rest.done .clock{color:var(--good)}
  .bar{position:absolute;left:0;top:0;height:2px;background:var(--accent);width:0;transition:width .95s linear}

  /* ---------- historial ---------- */
  .sec{padding:20px 0 4px}
  .sec h2{
    font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--text-3);margin:0 0 10px;
  }
  .ses{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
  .seshd{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;text-align:left;padding:12px 14px;min-height:var(--tap)}
  .date{
    font-family:var(--cond);font-weight:700;line-height:.98;text-align:center;
    width:40px;flex:none;
  }
  .date b{display:block;font-size:22px;letter-spacing:-.01em}
  .date span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
  .badge{
    display:inline-block;font-family:var(--cond);font-weight:600;font-size:11.5px;
    letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:99px;
    border:1px solid var(--line);color:var(--text-2);
  }
  .badge.empuje{color:#F2A03D;border-color:rgba(242,160,61,.4)}
  .badge.tiron{color:#7FA8E8;border-color:rgba(127,168,232,.4)}
  .badge.pierna{color:#8FCB8A;border-color:rgba(143,203,138,.4)}
  .seshd .mid{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
  .sesmeta{display:block;font-family:var(--mono);font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .sesbody{padding:2px 14px 14px;display:flex;flex-direction:column;gap:11px}
  .lrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;padding-bottom:9px;border-bottom:1px solid var(--line-soft)}
  .lrow:last-child{border-bottom:none;padding-bottom:0}
  .lrow .n{font-size:14px;font-weight:500}
  .lrow .v{font-family:var(--mono);font-size:12.5px;color:var(--text-2);text-align:right;font-variant-numeric:tabular-nums}

  .prog{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:13px 14px;margin-bottom:8px}
  .prog .ph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline}
  .prog .ph .n{font-weight:600;font-size:14.5px}
  .prog .ph .best{font-family:var(--mono);font-size:12.5px;color:var(--accent);font-variant-numeric:tabular-nums}
  .prog .note{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:5px}
  .prog svg.chart{display:block;width:100%;height:60px;margin-top:9px}

  .empty{
    border:1px dashed var(--line);border-radius:var(--r);padding:24px 18px;text-align:center;
    color:var(--text-3);font-size:13.5px;
  }
  .empty b{display:block;font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--text-2);margin-bottom:6px}

  /* ---------- datos ---------- */
  .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;margin-bottom:9px}
  .card h3{font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
  .card p{margin:0 0 11px;color:var(--text-2);font-size:13.5px;max-width:60ch}
  .card p:last-child{margin-bottom:0}
  .card.warn{border-color:var(--accent-dim)}
  .card.warn h3{color:var(--accent)}
  textarea{
    width:100%;min-height:110px;resize:vertical;background:var(--bg);
    border:1px solid var(--line);border-radius:8px;padding:10px;
    font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--text-2);
  }
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .btn{
    min-height:var(--tap);padding:0 18px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface-2);font-family:var(--cond);font-weight:700;font-size:15px;
    letter-spacing:.07em;text-transform:uppercase;
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.danger{color:var(--danger);border-color:rgba(216,86,75,.35);background:var(--bg)}
  .steps{margin:0;padding-left:20px;color:var(--text-2);font-size:13.5px}
  .steps li{margin-bottom:6px}

  function load(){

        return seed();

    if(!d.settings) d.settings = {rest:90, autoRest:true};

    if(!d.perfil) d.perfil = {nombre:"", altura:null, nacimiento:"", objetivo:null, metaSemanal:3};

  function $(s,r){ return (r||document).querySelector(s); }

  function plural(n,one,many){ return n+" "+(n===1?one:many); }
  function capital(t){ return t ? t.charAt(0).toUpperCase()+t.slice(1) : t; }
  function num(n,d){ return Number(n).toLocaleString("es-ES",{maximumFractionDigits:(d===undefined?2:d)}); }
  function parseNum(v){ var n = parseFloat(String(v).replace(",",".")); return isFinite(n)?n:NaN; }
  function todayISO(){
    var d = new Date(), m = d.getMonth()+1, day = d.getDate();
    return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;
  }

  function findEx(id){
    for(var d in S.routines){

  function dayName(id){
    for(var i=0;i<DAYS.length;i++) if(DAYS[i].id===id) return DAYS[i].name;
    return id;

  function setText(s){
    if(s.band) return s.reps + " × Banda " + s.band;

  }
  function volume(sets){
    var v = 0;
    for(var i=0;i<sets.length;i++) if(sets[i].w) v += sets[i].w * sets[i].reps;
    return v;
  }
  function topWeight(sets){
    var m = 0;
    for(var i=0;i<sets.length;i++) if(sets[i].w && sets[i].w > m) m = sets[i].w;
    return m;
  }
  function sortedSessions(){
    return S.sessions.slice().sort(function(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  }
  function todaySession(create){
    var t = todayISO();
    for(var i=0;i<S.sessions.length;i++)
      if(S.sessions[i].date===t && S.sessions[i].routine===ui.day) return S.sessions[i];
    if(!create) return null;
    var s = {id:"s-"+ui.day+"-"+Date.now(), date:t, routine:ui.day, sets:[]};
    S.sessions.push(s);
    return s;
  }
  function prevSession(){
    var sorted = sortedSessions(), t = todayISO();
    for(var i=0;i<sorted.length;i++)
      if(sorted[i].routine===ui.day && sorted[i].date !== t) return sorted[i];
    return null;
  }
  function setsOf(session, exId){
    if(!session) return [];
    return session.sets.filter(function(s){ return s.ex===exId; });
  }
  function historyOf(exId){
    var t = todayISO(), out = [];
    S.sessions.forEach(function(s){
      var sets = setsOf(s, exId);
      if(sets.length && s.date !== t) out.push({date:s.date, sets:sets});
    });
    out.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    return out;
  }

  /* ============================================================
     3b. RÉCORDS, ESTADÍSTICAS Y PESO CORPORAL
     ============================================================ */

  /* mejor serie de un ejercicio: más peso; a igualdad de peso, más repes */
  function recordDe(exId, excluirHoy){
    var t = todayISO(), best = null;
    S.sessions.forEach(function(s){
      if(excluirHoy && s.date === t) return;
      setsOf(s, exId).forEach(function(st){
        if(!st.w) return;
        if(!best || st.w > best.w || (st.w === best.w && st.reps > best.reps))
          best = {w:st.w, reps:st.reps, date:s.date};
      });
    });
    return best;
  }

  function lunesDe(iso){
    var p = iso.split("-"), d = new Date(+p[0], +p[1]-1, +p[2]);
    var dow = (d.getDay() + 6) % 7;           /* lunes = 0 */
    d.setDate(d.getDate() - dow);
    return isoDe(d);
  }
  function isoDe(d){
    var m = d.getMonth()+1, day = d.getDate();
    return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;
  }
  function diasEntre(a, b){
    var pa = a.split("-"), pb = b.split("-");
    return Math.round((new Date(+pb[0],+pb[1]-1,+pb[2]) - new Date(+pa[0],+pa[1]-1,+pa[2])) / 86400000);
  }
  function restaDias(iso, n){
    var p = iso.split("-"), d = new Date(+p[0], +p[1]-1, +p[2]);
    d.setDate(d.getDate() - n);
    return isoDe(d);
  }

  function resumen(){
    var t = todayISO(), lun = lunesDe(t), mes = t.slice(0,7), hace7 = restaDias(t,6);
    var r = {total:S.sessions.length, semana:0, mes:0, vol7:0, series7:0, ultimo:null, dias:null};
    S.sessions.forEach(function(s){
      if(s.date >= lun) r.semana++;
      if(s.date.slice(0,7) === mes) r.mes++;
      if(s.date >= hace7){ r.vol7 += volume(s.sets); r.series7 += s.sets.length; }
      if(!r.ultimo || s.date > r.ultimo) r.ultimo = s.date;
    });
    if(r.ultimo) r.dias = diasEntre(r.ultimo, t);
    return r;
  }

  /* última sesión de cada rutina, para las pestañas de día */
  function ultimaDe(rutina){
    var last = null;
    S.sessions.forEach(function(s){
      if(s.routine === rutina && (!last || s.date > last)) last = s.date;
    });
    return last;
  }

  function volumenPorSemana(n){
    var out = [], t = todayISO(), lun = lunesDe(t);
    for(var i = n-1; i >= 0; i--){
      var ini = restaDias(lun, i*7), fin = restaDias(lun, i*7 - 6);
      var v = 0, ses = 0;
      S.sessions.forEach(function(s){
        if(s.date >= ini && s.date <= fin){ v += volume(s.sets); ses++; }
      });
      out.push({d:ini, v:v, ses:ses});
    }
    return out;
  }

  /* --- peso corporal y medidas --- */
  function serieMedida(k){
    var src = k === "peso" ? S.pesos : S.medidas;
    return src.filter(function(x){ return typeof x[k] === "number" && isFinite(x[k]); })
              .map(function(x){ return {d:x.d, v:x[k]}; })
              .sort(function(a,b){ return a.d < b.d ? -1 : 1; });
  }
  function ultimaMedida(k){
    var s = serieMedida(k);
    return s.length ? s[s.length-1] : null;
  }
  /* valor más cercano a hace N días, para comparar */
  function medidaHace(k, dias){
    var s = serieMedida(k);
    if(s.length < 2) return null;
    var obj = restaDias(todayISO(), dias), cand = null;
    s.forEach(function(p){ if(p.d <= obj) cand = p; });
    return cand && cand !== s[s.length-1] ? cand : null;
  }
  function guardarMedida(k, val, fecha){
    var src = k === "peso" ? S.pesos : S.medidas;
    var reg = null;
    for(var i=0;i<src.length;i++) if(src[i].d === fecha) reg = src[i];
    if(!reg){ reg = {d:fecha}; src.push(reg); }
    if(val === null) delete reg[k]; else reg[k] = val;
    /* limpia registros que se han quedado sin ningún valor */
    var vacio = Object.keys(reg).filter(function(x){ return x !== "d"; }).length === 0;
    if(vacio){
      if(k === "peso") S.pesos = S.pesos.filter(function(x){ return x !== reg; });
      else S.medidas = S.medidas.filter(function(x){ return x !== reg; });
    }
    save();
  }
  function edadAnios(){
    var n = S.perfil.nacimiento;
    if(!n || n.length < 10) return null;
    var hoy = new Date(), p = n.split("-");
    var a = hoy.getFullYear() - +p[0];
    var m = (hoy.getMonth()+1) - +p[1];
    if(m < 0 || (m === 0 && hoy.getDate() < +p[2])) a--;
    return (a > 0 && a < 120) ? a : null;
  }
  function imc(){
    var alt = S.perfil.altura, p = ultimaMedida("peso");
    if(!alt || !p) return null;
    var m = alt / 100;
    var v = p.v / (m*m);
    var cat = v < 18.5 ? "bajo peso" : v < 25 ? "normal" : v < 30 ? "sobrepeso" : "obesidad";
    return {v:v, cat:cat};
  }

  /* ============================================================
     3c. GRÁFICAS

  var chartN = 0;

  /* línea de evolución: una serie, etiqueta directa solo en el último punto */
  function lineChart(pts, o){
    o = o || {};
    var uid = "c" + (++chartN);
    if(!pts.length) return '<div class="empty"><b>Sin datos todavía</b>'+esc(o.vacio || "Apunta un valor para empezar la gráfica.")+'</div>';
    if(pts.length === 1){
      return '<div class="cap">Un solo registro: <b>'+num(pts[0].v,o.dec)+' '+esc(o.unidad||"")+'</b> el '+
             esc(fmtDate(pts[0].d,{day:"numeric",month:"long"}))+'. Apunta otro y verás la evolución.</div>';
    }
    var W = 320, H = 112, pl = 6, pr = 46, pt = 12, pb = 20;
    var vals = pts.map(function(p){ return p.v; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if(max === min){ max = max + Math.max(0.5, max*0.02); min = min - Math.max(0.5, min*0.02); }
    else { var pad = (max-min)*0.15; max += pad; min -= pad; }
    var iw = W - pl - pr, ih = H - pt - pb;
    var xy = pts.map(function(p,i){
      return [pl + iw*i/(pts.length-1), pt + ih - (p.v-min)/(max-min)*ih];
    });
    var linea = xy.map(function(p,i){ return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1); }).join(" ");
    var area = linea + " L"+xy[xy.length-1][0].toFixed(1)+" "+(pt+ih)+" L"+xy[0][0].toFixed(1)+" "+(pt+ih)+" Z";
    var ult = xy[xy.length-1], uv = vals[vals.length-1];
    var col = o.color || "#F2A03D";

    var h = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" data-chart="'+uid+'" role="img" aria-label="'+
      esc(o.aria || "Evolución")+': de '+num(vals[0],o.dec)+' a '+num(uv,o.dec)+' '+esc(o.unidad||"")+'">';
    h += '<defs><linearGradient id="g'+uid+'" x1="0" y1="0" x2="0" y2="1">' +
         '<stop offset="0" stop-color="'+col+'" stop-opacity=".24"/>' +
         '<stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>';
    h += '<line x1="'+pl+'" y1="'+pt+'" x2="'+(pl+iw)+'" y2="'+pt+'" stroke="#26211E" stroke-width="1"/>';
    h += '<line x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(pl+iw)+'" y2="'+(pt+ih)+'" stroke="#342E29" stroke-width="1"/>';
    h += '<path d="'+area+'" fill="url(#g'+uid+')"/>';
    h += '<path d="'+linea+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    xy.forEach(function(p,i){
      h += '<circle class="pt" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===xy.length-1?4.4:2.8)+
           '" fill="'+(i===xy.length-1?col:"#131110")+'" stroke="'+col+'" stroke-width="1.8"/>';
    });
    /* zonas de toque generosas, más grandes que el punto */
    xy.forEach(function(p,i){
      h += '<rect class="hit" data-act="pt" data-c="'+uid+'" data-v="'+esc(num(pts[i].v,o.dec)+" "+(o.unidad||""))+
           '" data-d="'+esc(fmtDate(pts[i].d,{day:"numeric",month:"long"}))+'" x="'+(p[0]-iw/(pts.length-1)/2).toFixed(1)+
           '" y="0" width="'+(iw/(pts.length-1)).toFixed(1)+'" height="'+H+'"/>';
    });
    h += '<text x="'+(pl+iw+7)+'" y="'+(ult[1]+4).toFixed(1)+'" fill="#F2EDE6" font-family="IBM Plex Mono, monospace" font-size="12">'+
         num(uv,o.dec)+'</text>';
    h += '<text x="'+pl+'" y="'+(H-4)+'" fill="#8A8076" font-family="IBM Plex Mono, monospace" font-size="9.5">'+
         esc(fmtDate(pts[0].d,{day:"numeric",month:"short"}))+'</text>';
    h += '<text x="'+(pl+iw)+'" y="'+(H-4)+'" text-anchor="end" fill="#8A8076" font-family="IBM Plex Mono, monospace" font-size="9.5">'+
         esc(fmtDate(pts[pts.length-1].d,{day:"numeric",month:"short"}))+'</text>';
    h += '</svg><div class="cap" id="cap'+uid+'">'+esc(o.pie || "Toca la gráfica para ver cada dato.")+'</div>';
    return h;
  }

  /* barras de volumen por semana */
  function barChart(bars, o){
    o = o || {};
    var uid = "b" + (++chartN);
    var max = 0;
    bars.forEach(function(b){ if(b.v > max) max = b.v; });
    if(!max) return '<div class="empty"><b>Sin volumen aún</b>Cuando registres series con peso verás aquí tu carga semanal.</div>';
    var W = 320, H = 96, pl = 4, pr = 4, pt = 14, pb = 18;
    var iw = W - pl - pr, ih = H - pt - pb;
    var bw = iw / bars.length;
    var h = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" data-chart="'+uid+'" role="img" aria-label="'+
      esc(o.aria || "Volumen por semana")+'">';
    h += '<line x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(pl+iw)+'" y2="'+(pt+ih)+'" stroke="#342E29" stroke-width="1"/>';
    bars.forEach(function(b,i){
      var bh = max ? (b.v/max)*ih : 0;
      var x = pl + bw*i + 2, w = Math.max(4, bw - 4), y = pt + ih - bh;
      var ultima = i === bars.length-1;
      if(bh > 0){
        h += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(2,bh).toFixed(1)+

      } else {
        h += '<rect x="'+x.toFixed(1)+'" y="'+(pt+ih-2)+'" width="'+w.toFixed(1)+'" height="2" rx="1" fill="#2A2421"/>';
      }
      h += '<rect class="hit" data-act="pt" data-c="'+uid+'" data-v="'+esc(num(b.v,0)+" kg · "+plural(b.ses,"sesión","sesiones"))+
           '" data-d="'+esc("Semana del "+fmtDate(b.d,{day:"numeric",month:"short"}))+'" x="'+(pl+bw*i).toFixed(1)+
           '" y="0" width="'+bw.toFixed(1)+'" height="'+H+'"/>';
    });
    var u = bars[bars.length-1];
    h += '<text x="'+(pl+iw)+'" y="10" text-anchor="end" fill="#F2EDE6" font-family="IBM Plex Mono, monospace" font-size="11">'+
         num(u.v,0)+' kg</text>';
    h += '<text x="'+pl+'" y="'+(H-4)+'" fill="#8A8076" font-family="IBM Plex Mono, monospace" font-size="9.5">'+
         esc(fmtDate(bars[0].d,{day:"numeric",month:"short"}))+'</text>';
    h += '<text x="'+(pl+iw)+'" y="'+(H-4)+'" text-anchor="end" fill="#8A8076" font-family="IBM Plex Mono, monospace" font-size="9.5">esta semana</text>';
    h += '</svg><div class="cap" id="cap'+uid+'">Toca una barra para ver la semana.</div>';
    return h;
  }

  var toastT;
  function toast(msg, accion){
    var el = $("#toast");

  /* ============================================================
     4. TEMPORIZADOR DE DESCANSO
     ============================================================ */
  var timer = { left:0, total:0, tick:null };
  function renderClock(){
    var r = $("#rest"), c = $("#clock"), b = $("#bar");
    var v = timer.left > 0 ? timer.left : (timer.total && timer.tick===null ? 0 : S.settings.rest);
    var mm = Math.floor(Math.abs(v)/60), ss = Math.abs(v)%60;
    c.textContent = mm + ":" + (ss<10?"0":"") + ss;
    r.classList.toggle("run", timer.left > 0);
    r.classList.toggle("done", timer.left === 0 && timer.total > 0);
    b.style.width = (timer.left > 0 && timer.total) ? (100 - timer.left/timer.total*100) + "%" : "0%";
  }
  function startRest(sec){
    stopRest(true);
    timer.total = sec || S.settings.rest;
    timer.left = timer.total;
    renderClock();
    timer.tick = setInterval(function(){
      timer.left--;
      if(timer.left <= 0){
        timer.left = 0;
        clearInterval(timer.tick); timer.tick = null;
        if(navigator.vibrate) try{ navigator.vibrate([120,60,120]); }catch(e){}
        toast("Descanso terminado");
      }
      renderClock();
    }, 1000);
  }
  function stopRest(quiet){
    if(timer.tick){ clearInterval(timer.tick); timer.tick = null; }
    timer.left = 0; timer.total = 0;
    if(!quiet) renderClock();
  }
  $("#clock").addEventListener("click", function(){
    if(timer.tick) stopRest(); else startRest();
  });
  $("#restMinus").addEventListener("click", function(){
    if(!timer.tick){ S.settings.rest = Math.max(15, S.settings.rest - 15); save(); }
    else timer.left = Math.max(1, timer.left - 15);
    renderClock();
  });
  $("#restPlus").addEventListener("click", function(){

  $("#photoInput").addEventListener("change", function(e){
    var f = e.target.files && e.target.files[0];
    var id = pendingPhoto;
    e.target.value = "";
    if(!f || !id) return;
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 240;
        var side = Math.min(img.width, img.height);
        var cv = document.createElement("canvas");
        cv.width = max; cv.height = max;
        var cx = cv.getContext("2d");
        cx.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, max, max);
        PH[id] = cv.toDataURL("image/jpeg", 0.72);
        if(savePhotos()){ toast("Foto guardada"); render(); }
        else { delete PH[id]; }
      };
      img.onerror = function(){ toast("No se pudo leer la imagen"); };
      img.src = reader.result;
    };
    reader.onerror = function(){ toast("No se pudo leer la imagen"); };
    reader.readAsDataURL(f);
  });

  /* calendario del mes: un día entrenado se marca con el color y la inicial de la rutina */
  function renderCal(){
    var t = todayISO();
    var base = ui.mes || t.slice(0,7);
    var y = +base.slice(0,4), m = +base.slice(5,7);
    var porFecha = {};
    S.sessions.forEach(function(s){ porFecha[s.date] = s; });

    var primero = new Date(y, m-1, 1);
    var dias = new Date(y, m, 0).getDate();
    var offset = (primero.getDay() + 6) % 7;
    var sigDisponible = base < t.slice(0,7);

    var h = '<div class="cal"><div class="calnav">' +
      '<button data-act="mes" data-d="-1" aria-label="Mes anterior">‹</button>' +
      '<b>'+esc(capital(primero.toLocaleDateString("es-ES",{month:"long",year:"numeric"})))+'</b>' +
      '<button data-act="mes" data-d="1" aria-label="Mes siguiente"'+(sigDisponible?"":" disabled")+'>›</button>' +
      '</div><div class="calgrid">';
    ["L","M","X","J","V","S","D"].forEach(function(d){ h += '<div class="dow">'+d+'</div>'; });
    for(var i=0;i<offset;i++) h += '<div class="cd pad"></div>';
    for(var d=1; d<=dias; d++){
      var iso = y+"-"+(m<10?"0":"")+m+"-"+(d<10?"0":"")+d;
      var ses = porFecha[iso];
      h += '<div class="cd'+(ses?" on":"")+(iso===t?" hoy":"")+'">' +
           (ses ? '<em class="'+ses.routine+'">'+esc(dayName(ses.routine).charAt(0))+'</em>' : '') +
           '<span>'+d+'</span></div>';
    }
    h += '</div><div class="legend">' +
      DAYS.map(function(x){ return '<span><i style="background:var(--r-'+x.id+')"></i>'+esc(x.name)+'</span>'; }).join("") +
      '</div></div>';
    return h;
  }

    });
    h += '</div>';
    return h;

  function fichaMedida(k, nombre, unidad){
    var ult = ultimaMedida(k);
    var ref = medidaHace(k, 30) || medidaHace(k, 7);
    var dif = (ult && ref) ? ult.v - ref.v : null;
    var cls = "flat";
    return '<div class="mrow2">' +
      '<span class="d">'+esc(nombre)+'</span>' +
      '<span class="v">'+(ult ? num(ult.v,1)+' <small style="font-size:11px;color:var(--text-3)">'+esc(unidad)+'</small>' : '<span style="color:var(--text-3)">—</span>')+'</span>' +
      '<span class="c '+cls+'">'+(dif === null ? '' : (dif>0?"+":"")+num(dif,1))+'</span>' +
      '</div>';
  }

  function renderPerfil(){
    var hoy = todayISO();
    var pesos = serieMedida("peso");
    var ult = pesos.length ? pesos[pesos.length-1] : null;
    var d7 = medidaHace("peso", 7), d30 = medidaHace("peso", 30);
    var obj = S.perfil.objetivo, im = imc(), ed = edadAnios();

    var h = '<div class="sec"><h2>Peso corporal</h2>';

    h += '<div class="hero">';
    if(ult){
      var cuando = diasEntre(ult.d, hoy);
      h += '<div class="now"><b>'+num(ult.v,1)+'<small>kg</small></b>' +
           '<span class="when">'+(cuando===0?"hoy":cuando===1?"ayer":"hace "+cuando+" días")+'</span></div>';
      var linea = "";
      [[d7,"7 días"],[d30,"30 días"]].forEach(function(par){
        if(!par[0]) return;
        var dif = ult.v - par[0].v;
        var cls = "flat";
        if(Math.abs(dif) >= 0.05 && obj){
          var antes = Math.abs(par[0].v - obj), ahora = Math.abs(ult.v - obj);
          cls = ahora < antes ? "up" : "down";     /* up = te acerca al objetivo */
        }
        linea += '<span>'+par[1]+'<em class="delta '+cls+'">'+(dif>0?"+":"")+num(dif,1)+' kg</em></span>';
      });
      if(linea) h += '<div class="deltas">'+linea+'</div>';
    } else {
      h += '<div class="now"><b style="color:var(--text-3)">—</b><span class="when">sin registro</span></div>' +
           '<div class="deltas"><span>Apunta tu peso abajo y empieza la gráfica</span></div>';
    }

    if(obj && ult){
      var falta = ult.v - obj;
      var origen = pesos[0].v;
      var total = Math.abs(origen - obj) || 1;
      var hecho = Math.abs(origen - ult.v);
      var pct = Math.max(0, Math.min(100, Math.round(hecho/total*100)));
      var llego = Math.abs(falta) < 0.3 || (origen > obj ? ult.v <= obj : ult.v >= obj);
      h += '<div class="goal"><div class="gl"><span>Objetivo '+num(obj,1)+' kg</span><b>'+
        (llego ? "conseguido" : num(Math.abs(falta),1)+" kg")+'</b></div>' +
        '<div class="track"><i class="'+(llego?"done":"")+'" style="width:'+(llego?100:pct)+'%"></i></div></div>';
    }
    h += '</div>';

    h += '<div class="card">' +
      lineChart(pesos, {unidad:"kg", dec:1, aria:"Evolución del peso corporal",
                        pie:"Toca la gráfica para ver cada pesaje.",
                        vacio:"Apunta tu peso y aquí verás la evolución."}) +
      '<div class="quick" style="margin-top:12px">' +
      '<div class="f"><label for="pIn">Peso de hoy (kg)</label>' +
      '<input id="pIn" inputmode="decimal" placeholder="'+(ult?num(ult.v,1):"78,5")+'"></div>' +
      '<button data-act="addpeso">Apuntar</button></div>' +
      '<p style="margin-top:8px">Pésate siempre a la misma hora, mejor en ayunas. Si ya has apuntado hoy, se sustituye.</p>';

    if(pesos.length){
      h += '<div class="mlist" style="margin-top:12px">';
      pesos.slice().reverse().slice(0,6).forEach(function(p){
        h += '<div class="mrow2"><span class="d">'+esc(fmtDate(p.d,{day:"numeric",month:"short"}))+'</span>' +
             '<span class="v">'+num(p.v,1)+' <small style="font-size:11px;color:var(--text-3)">kg</small></span>' +
             '<button class="x" data-act="rmpeso" data-d="'+p.d+'" aria-label="Borrar pesaje">×</button></div>';
      });
      h += '</div>';
    }
    h += '</div></div>';

    /* --- medidas --- */
    h += '<div class="sec"><h2>Medidas</h2><div class="card">' +
      '<div class="mlist">';
    MEDIDAS.slice(1).forEach(function(m){ h += fichaMedida(m.k, m.n, m.u); });
    h += '</div><div class="frm" style="margin-top:12px">';
    MEDIDAS.slice(1).forEach(function(m){
      var u = ultimaMedida(m.k);
      h += '<div class="f"><label for="m_'+m.k+'">'+esc(m.n)+' (cm)</label>' +
           '<input id="m_'+m.k+'" inputmode="decimal" placeholder="'+(u?num(u.v,1):"—")+'"></div>';
    });
    h += '</div><div class="btnrow" style="margin-top:11px">' +
      '<button class="btn primary" data-act="addmedidas">Guardar medidas de hoy</button></div>' +
      '<p style="margin-top:9px">Mide en frío y relajado, siempre en el mismo sitio. La cifra de la derecha es el cambio desde hace un mes.</p>' +
      '</div></div>';

    /* --- datos personales --- */
    h += '<div class="sec"><h2>Tus datos</h2><div class="card">' +
      '<div class="frm">' +
      '<div class="f wide"><label for="p_nombre">Nombre</label>' +
      '<input id="p_nombre" data-act="perfil" data-k="nombre" value="'+esc(S.perfil.nombre||"")+'" placeholder="Kiko"></div>' +
      '<div class="f"><label for="p_altura">Altura (cm)</label>' +
      '<input id="p_altura" data-act="perfil" data-k="altura" inputmode="numeric" value="'+(S.perfil.altura||"")+'" placeholder="178"></div>' +
      '<div class="f"><label for="p_nac">Nacimiento</label>' +
      '<input id="p_nac" data-act="perfil" data-k="nacimiento" type="date" value="'+esc(S.perfil.nacimiento||"")+'"></div>' +
      '<div class="f"><label for="p_obj">Objetivo (kg)</label>' +
      '<input id="p_obj" data-act="perfil" data-k="objetivo" inputmode="decimal" value="'+(S.perfil.objetivo||"")+'" placeholder="75"></div>' +
      '<div class="f"><label for="p_meta">Entrenos/semana</label>' +
      '<input id="p_meta" data-act="perfil" data-k="metaSemanal" inputmode="numeric" value="'+(S.perfil.metaSemanal||3)+'"></div>' +
      '</div>';
    if(im || ed){
      h += '<div class="tiles" style="margin-top:12px;margin-bottom:0">';
      if(im) h += '<div class="tile"><b>'+num(im.v,1)+'</b><span>IMC · '+esc(im.cat)+'</span></div>';
      if(ed) h += '<div class="tile"><b>'+ed+'</b><span>Años</span></div>';
      h += '</div>';
      if(im) h += '<p style="margin-top:9px">El IMC es solo una referencia rápida: no distingue músculo de grasa, así que con entrenamiento de fuerza tiende a quedarse corto.</p>';
    }
    h += '</div></div>';

    /* --- ajustes --- */
    h += '<div class="sec"><h2>Ajustes</h2><div class="card">' +
      '<button class="sw" data-act="autorest" aria-pressed="'+(S.settings.autoRest?"true":"false")+'">' +
      '<span class="t"><b>Descanso automático</b><span>Al guardar una serie arranca la cuenta atrás de '+S.settings.rest+' s.</span></span><i></i></button>' +
      '<div class="quick" style="margin-top:12px">' +
      '<div class="f"><label for="rIn">Descanso (segundos)</label>' +
      '<input id="rIn" inputmode="numeric" value="'+S.settings.rest+'"></div>' +
      '<button data-act="setrest">Guardar</button></div>' +
      '</div></div>';

    /* --- copia de seguridad --- */
    var n = 0;
    S.sessions.forEach(function(s){ n += s.sets.length; });
    var nf = Object.keys(PH).length;
    h += '<div class="sec"><h2>Copia de seguridad</h2>' +
      '<div class="card warn"><h3>Guarda una copia de vez en cuando</h3>' +
      '<p>Todo vive en este navegador: '+S.sessions.length+' sesiones, '+n+' series y '+pesos.length+' pesajes. ' +
      'Si borras los datos de Safari o cambias de móvil, se van contigo solo si copias este texto y lo guardas en una nota.</p>' +
      '<p>Las fotos que hayas puesto ('+nf+') no entran en la copia, para que el texto siga siendo corto.</p></div>' +

      '<div class="card"><h3>Exportar</h3>' +
      '<textarea id="exp" readonly>'+esc(JSON.stringify(S))+'</textarea>' +
      '<div class="btnrow"><button class="btn primary" data-act="copy">Copiar todo</button></div></div>' +

      '<div class="card"><h3>Importar</h3>' +
      '<p>Pega aquí una copia anterior. Sustituye todo lo que hay ahora.</p>' +
      '<textarea id="imp" placeholder="Pega aquí el texto de la copia…"></textarea>' +
      '<div class="btnrow"><button class="btn" data-act="import">Importar</button>' +
      '<button class="btn danger" data-act="reset">'+(ui.confirm==="reset"?"¿Seguro? Toca otra vez":"Restaurar datos iniciales")+'</button></div></div></div>';

    h += '<div class="sec"><h2>Fotos</h2>' +
      '<div class="card"><h3>'+plural(nf,"foto propia","fotos propias")+'</h3>' +
      '<p>Despliega un ejercicio y toca la imagen para poner la tuya, desde la cámara o el carrete. Se recorta en cuadrado y se guarda comprimida en el propio móvil.</p>' +
      (nf ? '<div class="btnrow"><button class="btn danger" data-act="rmall">'+(ui.confirm==="rmall"?"¿Seguro? Toca otra vez":"Borrar todas las fotos")+'</button></div>' : '') +
      '</div></div>';

    h += '<div class="sec"><h2>Instalar en el móvil</h2>' +
      '<div class="card"><ol class="steps">' +
      '<li>Abre esta página en <b>Safari</b> (iPhone) o Chrome (Android).</li>' +
      '<li>Toca el botón <b>Compartir</b> y elige <b>Añadir a pantalla de inicio</b>.</li>' +
      '<li>Ábrela desde el icono: a pantalla completa, sin barra del navegador y funciona sin cobertura.</li>' +
      '</ol><p style="margin-top:11px">Cada dispositivo guarda su propio historial. Para pasarlo de uno a otro, usa Exportar e Importar.</p></div></div>';

    return h;
  }

  /* ============================================================
     9. RENDER + EVENTOS
     ============================================================ */
  function render(){
    $("#today").textContent = fmtDate(todayISO(),{weekday:"long",day:"numeric",month:"long"});
    Array.prototype.forEach.call($("#views").children, function(b){
      b.setAttribute("aria-current", String(b.dataset.view === ui.view));
    });
    renderDays();
    var v = $("#view");
    v.innerHTML = ui.view === "log" ? renderLog() : ui.view === "prog" ? renderProg() : renderPerfil();

    var dock = $("#dock");
    dock.hidden = ui.view !== "log";
    if(!dock.hidden){
      var ses = todaySession(false), sets = ses ? ses.sets : [];
      $("#sum").innerHTML = sets.length
        ? '<b>'+sets.length+'</b> series · <b>'+num(volume(sets),0)+'</b> kg · '+esc(dayName(ui.day))
        : esc(dayName(ui.day)) + ' · sin series todavía';
      renderClock();
    }
  }

  $("#toast").addEventListener("click", function(e){
    var b = e.target.closest("[data-act]");
    if(!b || b.dataset.act !== "undo" || !deshacer) return;
    var d = deshacer;
    deshacer = null;
    var ses = todaySession(true);
    ses.sets.splice(Math.min(d.i, ses.sets.length), 0, d.set);
    save();
    $("#toast").classList.remove("on");
    render();
    toast("Serie recuperada");
  });

  $("#views").addEventListener("click", function(e){
    var b = e.target.closest("button[data-view]");
    if(!b) return;
    ui.view = b.dataset.view; ui.open = null; ui.confirm = null;
    ui.edit = false; ui.adding = false; ui.editSet = null;
    window.scrollTo(0,0);
    render();
  });

  $("#days").addEventListener("click", function(e){
    var b = e.target.closest("button[data-day]");
    if(!b) return;
    ui.day = b.dataset.day; ui.open = null; ui.confirm = null;
    ui.adding = false; ui.editSet = null;
    var f = exercises(ui.day)[0];
    if(f) ui.open = f.id;
    render();
  });

  $("#view").addEventListener("click", function(e){
    var b = e.target.closest("[data-act]");
    if(!b || b.tagName === "INPUT") return;
    var act = b.dataset.act, id = b.dataset.id;

    if(act === "toggle"){ ui.open = (ui.open === id ? null : id); ui.confirm = null; ui.editSet = null; return render(); }
    if(act === "edit"){ ui.edit = !ui.edit; ui.confirm = null; return render(); }

    if(act === "photo"){ pendingPhoto = id; $("#photoInput").click(); return; }
    if(act === "rmphoto"){ delete PH[id]; savePhotos(); toast("Foto quitada"); return render(); }
    if(act === "rmall"){
      if(ui.confirm !== "rmall"){ ui.confirm = "rmall"; return render(); }
      PH = {}; savePhotos(); ui.confirm = null; toast("Fotos borradas"); return render();
    }

    if(act === "repeat"){
      var prev = prevSession(); if(!prev) return;
      var t = todaySession(true);
      prev.sets.forEach(function(s){
        var c = {ex:s.ex, reps:s.reps};
        if(s.band) c.band = s.band; else c.w = s.w;
        t.sets.push(c);
      });
      save(); toast("Series cargadas · ajusta lo que cambie"); return render();
    }
    if(act === "clear"){
      if(ui.confirm !== "clear"){ ui.confirm = "clear"; return render(); }
      var cur = todaySession(false);
      if(cur) S.sessions = S.sessions.filter(function(x){ return x !== cur; });
      ui.confirm = null; ui.editSet = null; save(); toast("Sesión de hoy vaciada"); return render();
    }

    if(act === "setmode"){
      var ex = findEx(id); if(!ex) return;
      ex.mode = b.dataset.m; ui.editSet = null; save(); return render();
    }
    if(act === "mode"){
      var ex2 = findEx(id); if(!ex2) return;
      ex2.mode = ex2.mode === "banda" ? "kg" : "banda"; save(); return render();
    }
    if(act === "band"){
      var wrap = b.parentNode;
      Array.prototype.forEach.call(wrap.children, function(x){ x.setAttribute("aria-pressed", String(x === b)); });
      return;
    }
    if(act === "step"){
      var art = b.closest(".ex");
      var input = art.querySelector(b.dataset.t === "w" ? ".wI" : ".rI");
      var d = +b.dataset.d;
      var cur2 = parseNum(input.value);
      if(!isFinite(cur2)) cur2 = 0;
      if(b.dataset.t === "w"){
        var nv = Math.max(0, Math.round((cur2 + d*2.5)*10)/10);
        input.value = nv ? num(nv) : "";
      } else {
        input.value = Math.max(1, Math.round(cur2 + d));
      }
      return;
    }
    if(act === "editset"){
      var i = +b.dataset.i;
      ui.editSet = (ui.editSet && ui.editSet.i === i) ? null : {ex:id, i:i};
      return render();
    }
    if(act === "canceledit"){ ui.editSet = null; return render(); }

    if(act === "add"){
      var exA = findEx(id); if(!exA) return;
      var artA = b.closest(".ex");
      var rI = artA.querySelector(".rI");
      var reps = Math.round(parseNum(rI.value));
      if(!isFinite(reps) || reps < 1){ toast("Pon las repeticiones"); rI.focus(); return; }
      var rec = {ex:id, reps:reps};
      var wI = artA.querySelector(".wI");
      if(!wI){
        var sel = artA.querySelector('.bands button[aria-pressed="true"]');
        if(!sel){ toast("Elige una banda"); return; }
        rec.band = sel.dataset.b;
      } else {
        var w = parseNum(wI.value);
        if(!isFinite(w) || w <= 0){ toast("Pon el peso"); wI.focus(); return; }
        rec.w = Math.round(w*100)/100;
      }
      if(ui.editSet && ui.editSet.ex === id){
        var sesE = todaySession(false);
        if(sesE) sesE.sets[ui.editSet.i] = rec;
        ui.editSet = null;
        save(); render(); toast("Serie corregida");
        return;
      }
      var recordPrevio = recordDe(id, false);
      todaySession(true).sets.push(rec);
      save();
      if(S.settings.autoRest) startRest();
      render();
      if(rec.w && (!recordPrevio || rec.w > recordPrevio.w ||
                   (rec.w === recordPrevio.w && rec.reps > recordPrevio.reps))){
        toast("¡Récord! " + rec.reps + " × " + num(rec.w) + " kg");
        if(navigator.vibrate) try{ navigator.vibrate([40,50,40,50,90]); }catch(e){}
      } else {
        toast("Serie guardada");
      }
      return;
    }
    if(act === "rmset"){
      var ses2 = todaySession(false); if(!ses2) return;
      var idx = +b.dataset.i;
      deshacer = {i:idx, set:ses2.sets[idx]};
      ses2.sets.splice(idx, 1);
      if(!ses2.sets.length) S.sessions = S.sessions.filter(function(x){ return x !== ses2; });
      ui.editSet = null;
      save(); render();
      toast("Serie borrada", "undo");
      return;
    }
    if(act === "up" || act === "down"){
      var l = exercises(ui.day);
      var i2 = l.findIndex(function(x){ return x.id === id; });
      var j = act === "up" ? i2-1 : i2+1;
      if(j < 0 || j >= l.length) return;
      var tmp = l[i2]; l[i2] = l[j]; l[j] = tmp;
      save(); return render();
    }
    if(act === "del"){
      if(ui.confirm !== id){ ui.confirm = id; return render(); }
      S.routines[ui.day] = exercises(ui.day).filter(function(x){ return x.id !== id; });
      ui.confirm = null; save(); toast("Ejercicio borrado"); return render();
    }
    if(act === "newex"){ ui.adding = true; render(); var f2 = $("#newName"); if(f2) f2.focus(); return; }
    if(act === "cancelex"){ ui.adding = false; return render(); }
    if(act === "createex"){
      var nm = ($("#newName").value || "").trim();
      if(!nm){ toast("Ponle nombre"); return; }
      exercises(ui.day).push({
        id: "x" + Date.now().toString(36),
        name: nm,
        equip: ($("#newEquip").value || "").trim(),
        mode: "kg"
      });
      ui.adding = false; save(); toast("Ejercicio añadido"); return render();
    }
    if(act === "copy"){
      var ta = $("#exp");
      ta.select(); ta.setSelectionRange(0, 999999);
      var ok = false;
      try{ ok = document.execCommand("copy"); }catch(err){}
      if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(function(){ toast("Copiado"); }); return; }
      toast(ok ? "Copiado" : "Selecciona y copia a mano");
      return;
    }
    if(act === "import"){
      var raw = ($("#imp").value || "").trim();
      if(!raw){ toast("Pega la copia primero"); return; }
      try{
        var d2 = JSON.parse(raw);
        if(!d2.routines || !d2.sessions) throw new Error("formato");
        S = migrar(d2);
        save(); toast("Datos importados"); return render();
      }catch(err){ toast("Ese texto no es una copia válida"); }
      return;
    }
    /* --- gráficas: tocar un punto muestra su dato debajo --- */
    if(act === "pt"){
      var cap = document.getElementById("cap" + b.dataset.c);
      if(cap) cap.innerHTML = esc(b.dataset.d) + ' · <b>' + esc(b.dataset.v) + '</b>';
      return;
    }

    /* --- calendario --- */
    if(act === "mes"){
      var base = ui.mes || todayISO().slice(0,7);
      var y = +base.slice(0,4), mm = +base.slice(5,7) + (+b.dataset.d);
      var dt = new Date(y, mm-1, 1);
      var cand = dt.getFullYear() + "-" + (dt.getMonth()+1 < 10 ? "0" : "") + (dt.getMonth()+1);
      if(cand > todayISO().slice(0,7)) return;
      ui.mes = cand;
      return render();
    }

    /* --- peso corporal --- */
    if(act === "addpeso"){
      var pi = $("#pIn"), v = parseNum(pi.value);
      if(!isFinite(v) || v <= 20 || v > 400){ toast("Pon un peso válido"); pi.focus(); return; }
      guardarMedida("peso", Math.round(v*10)/10, todayISO());
      toast("Peso apuntado");
      return render();
    }
    if(act === "rmpeso"){
      guardarMedida("peso", null, b.dataset.d);
      toast("Pesaje borrado");
      return render();
    }
    if(act === "addmedidas"){
      var puestas = 0;
      MEDIDAS.slice(1).forEach(function(m){
        var inp = document.getElementById("m_" + m.k);
        if(!inp) return;
        var val = parseNum(inp.value);
        if(isFinite(val) && val > 0){ guardarMedida(m.k, Math.round(val*10)/10, todayISO()); puestas++; }
      });
      if(!puestas){ toast("Rellena alguna medida"); return; }
      toast(plural(puestas, "medida guardada", "medidas guardadas"));
      return render();
    }

    /* --- ajustes --- */
    if(act === "autorest"){
      S.settings.autoRest = !S.settings.autoRest;
      save();
      toast(S.settings.autoRest ? "Descanso automático activado" : "Descanso automático desactivado");
      return render();
    }
    if(act === "setrest"){
      var ri = $("#rIn"), rv = Math.round(parseNum(ri.value));
      if(!isFinite(rv) || rv < 15 || rv > 600){ toast("Entre 15 y 600 segundos"); ri.focus(); return; }
      S.settings.rest = rv; save();
      toast("Descanso de " + rv + " s");
      return render();
    }

    /* --- sugerencia de progresión: rellena los campos --- */
    if(act === "sug"){
      var artS = b.closest(".ex");
      var wS = artS.querySelector(".wI"), rS = artS.querySelector(".rI");
      if(wS) wS.value = num(+b.dataset.w);
      if(rS) rS.value = b.dataset.r;
      toast("Ajustado · dale a Añadir serie cuando la hagas");
      return;
    }

    if(act === "reset"){
      if(ui.confirm !== "reset"){ ui.confirm = "reset"; return render(); }
      S = seed(); ui.confirm = null; ui.editSet = null; save(); toast("Datos iniciales restaurados"); return render();
    }
  });

  $("#view").addEventListener("change", function(e){
    var inp = e.target.closest('input[data-act="rename"]');
    if(inp){
      var ex = findEx(inp.dataset.id);
      if(ex && inp.value.trim()){ ex.name = inp.value.trim(); save(); }
      return;
    }

    var pf = e.target.closest('input[data-act="perfil"]');
    if(pf){
      var k = pf.dataset.k, val = pf.value.trim();
      if(k === "nombre" || k === "nacimiento"){
        S.perfil[k] = val;
      } else {
        var n = parseNum(val);
        if(k === "metaSemanal"){
          S.perfil[k] = (isFinite(n) && n >= 1 && n <= 7) ? Math.round(n) : 3;
        } else {
          S.perfil[k] = isFinite(n) && n > 0 ? Math.round(n*10)/10 : null;
        }
      }
      save();
      if(k !== "nombre") render();
      return;
    }

    if(e.target.id === "nota"){
      var sesN = todaySession(false);
      if(sesN){ sesN.nota = e.target.value.trim(); save(); }
      return;
    }
  });

  $("#view").addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    if(e.target.id === "newName" || e.target.id === "newEquip"){
      e.preventDefault();
      var btn = $('[data-act="createex"]'); if(btn) btn.click();
    } else if(e.target.id === "pIn"){
      e.preventDefault();
      var bp = $('[data-act="addpeso"]'); if(bp) bp.click();
    } else if(e.target.id === "rIn"){
      e.preventDefault();
      var br = $('[data-act="setrest"]'); if(br) br.click();
    } else if(e.target.id && e.target.id.indexOf("m_") === 0){
      e.preventDefault();
      e.target.blur();
    } else if(e.target.classList.contains("rI") || e.target.classList.contains("wI")){
      e.preventDefault();
      e.target.blur();
    }
  });

  /* funcionar sin cobertura: se registra solo si la app viene de un servidor https */
  if("serviceWorker" in navigator && location.protocol === "https:"){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  var first = exercises(ui.day)[0];
  if(first) ui.open = first.id;
  render();
})();
</script>
